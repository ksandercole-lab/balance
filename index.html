<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Balance">
  <meta name="description" content="Персональный финансовый планировщик">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="styles.css">
  <title>Balance</title>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div>
        <div class="eyebrow" id="eyebrow"></div>
        <h1 id="page-title">Balance</h1>
      </div>
      <button class="icon-button hidden" id="page-action" type="button" aria-label="Добавить">＋</button>
    </header>

    <main id="content" aria-live="polite"></main>

    <nav class="tabbar" aria-label="Разделы">
      <button class="tab active" data-tab="overview"><span>▦</span><small>Обзор</small></button>
      <button class="tab" data-tab="debts"><span>⇄</span><small>Долги</small></button>
      <button class="tab" data-tab="expenses"><span>▰</span><small>Расходы</small></button>
      <button class="tab" data-tab="calendar"><span>□</span><small>Календарь</small></button>
      <button class="tab" data-tab="tasks"><span>✓</span><small>Дела</small></button>
    </nav>
  </div>

  <dialog id="modal">
    <form method="dialog" id="modal-form">
      <header class="modal-header">
        <button class="text-button" value="cancel" formnovalidate>Отмена</button>
        <h2 id="modal-title"></h2>
        <button class="text-button strong" id="modal-save" value="default">Сохранить</button>
      </header>
      <div class="modal-body" id="modal-body"></div>
    </form>
  </dialog>

  <div id="toast" role="status"></div>
  <script src="app.js" defer></script>
</body>
</html>
